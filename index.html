<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Market</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Easy Market</h1>
        <p>সহজ কেনাকাটা, সাশ্রয়ী দামে</p>
    </header>

    <div class="container">
        <h2>আমাদের পণ্যসমূহ</h2>
        <div id="product-list" class="product-grid"></div>

        <!-- অর্ডার ফর্ম -->
        <div class="order-section" style="margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 10px;">
            <h2>অর্ডার ফর্ম</h2>
            <form action="https://formspree.io/f/shopeasymarket2@gmail.com" method="POST">
                <label>পণ্য:</label><br>
                <input type="text" name="product" value="Easy Market Product" style="width:100%; padding:8px; margin:5px 0 15px;"><br>

                <label>আপনার নাম:</label><br>
                <input type="text" name="name" placeholder="আপনার নাম লিখুন" required style="width:100%; padding:8px; margin:5px 0 15px;"><br>

                <label>মোবাইল নাম্বার:</label><br>
                <input type="text" name="phone" placeholder="আপনার মোবাইল নাম্বার দিন" required style="width:100%; padding:8px; margin:5px 0 15px;"><br>

                <button type="submit" style="background:#ff0000; color:#fff; border:none; padding:10px; width:100%; font-weight:bold; cursor:pointer; border-radius:5px;">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>মোবাইল: 01XXXXXXXXX</p>
        <p>ইমেইল: shopeasymarket2@gmail.com</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
