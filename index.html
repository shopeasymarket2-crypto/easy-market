<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Market</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { text-align: center; padding: 25px 20px; border-bottom: 4px solid #ff0000; background: #1a1a1a; }
        header h1 { color: #ff0000; margin: 0; font-size: 28px; }
        header p { color: #ccc; margin: 5px 0 0; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        h2 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 15px; }
        .product-card { background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .product-card h3 { margin: 10px 0; font-size: 20px; }
        .product-card p { color: #ff0000; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .order-btn { background: #ff0000; color: #fff; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .order-btn:hover { background: #cc0000; }
        .order-section { margin-top: 40px; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; }
        .order-form label { display: block; margin-top: 12px; margin-bottom: 5px; font-weight: bold; color: #ddd; }
        .order-form input, .order-form textarea { width: 100%; padding: 12px; box-sizing: border-box; background: #121212; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 14px; }
        .submit-btn { background: #ff0000; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; font-size: 16px; }
        .submit-btn:hover { background: #cc0000; }
        footer { text-align: center; padding: 20px; margin-top: 40px; border-top: 2px solid #333; color: #888; background: #1a1a1a; }
    </style>
</head>
<body>

    <header>
        <h1>Easy Market</h1>
        <p>সহজ কেনাকাটা, সাশ্রয়ী দামে</p>
    </header>

    <div class="container">
        <h2>আমাদের পণ্যসমূহ</h2>
        <div id="product-list" class="product-grid">
            <div class="product-card">
                <h3>প্রোডাক্ট ১</h3>
                <p>৫০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ১ - ৫০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ২</h3>
                <p>৮০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ২ - ৮০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ৩</h3>
                <p>১২০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ৩ - ১২০০ টাকা')">অর্ডার করুন</button>
            </div>
        </div>

        <div class="order-section">
            <h2>অর্ডার ফর্ম</h2>
            <form class="order-form" action="https://formspree.io/f/shopeasymarket2@gmail.com" method="POST">
                <label>পছন্দ کردہ পণ্য:</label>
                <input type="text" id="product-name" name="product" placeholder="উপরের যেকোনো 'অর্ডার করুন' বাটনে চাপ দিন" readonly required>

                <label>আপনার নাম:</label>
                <input type="text" name="customer_name" placeholder="আপনার পুরো নাম লিখুন" required>

                <label>মোবাইল নম্বর (বিকাশ/নগদ সহ):</label>
                <input type="text" name="phone" placeholder="আপনার মোবাইল নম্বর দিন" required>

                <label>পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea name="address" rows="3" placeholder="আপনার ঠিকানা লিখুন" required></textarea>

                <button type="submit" class="submit-btn">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>সহজ কেনাকাটা, সাশ্রয়ী দামে</p>
        <p>মোবাইল: <strong>01XXXXXXXXX</strong></p>
        <small>যোগাযোগ: shopeasymarket2@gmail.com</small>
    </footer>

    <script>
        function selectProduct(productInfo) {
            document.getElementById('product-name').value = productInfo;
            alert(productInfo + ' সিলেক্ট করা হয়েছে। নিচে ফর্মটি পূরণ করুন।');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
