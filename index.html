<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Market</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* সিম্পল হেডার */
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 { font-size: 32px; margin: 0; color: #38bdf8; }
        header p { color: #94a3b8; margin: 8px 0 0; font-size: 15px; }

        /* ব্যানার ছবি */
        .hero-section {
            padding: 25px 20px;
            text-align: center;
        }
        .hero-image-container {
            max-width: 850px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #1e293b;
        }
        .hero-image-container img {
            width: 100%;
            display: block;
            height: auto;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h2 {
            font-size: 22px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #111827;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .product-card h3 { margin: 0 0 10px; font-size: 18px; }
        .product-card p { color: #38bdf8; font-weight: bold; font-size: 17px; margin-bottom: 15px; }
        
        .order-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .order-btn:hover { background: #1d4ed8; }

        /* অর্ডার ফর্ম */
        .order-section {
            margin-top: 40px;
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }
        .order-form label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 14px;
        }
        .order-form input, .order-form textarea {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .submit-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 15px;
        }
        .submit-btn:hover { background: #15803d; }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Easy Market</h1>
        <p>সহজ কেনাকাটা, সাশ্রয়ী দামে</p>
    </header>

    <div class="hero-section">
        <div class="hero-image-container">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" alt="Banner">
        </div>
    </div>

    <div class="container">
        <h2>আমাদের পণ্যসমূহ</h2>
        <div class="product-grid">
            <div class="product-card">
                <h3>প্রোডাক্ট ১</h3>
                <p>৫০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ১ - ৫০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ২</h3>
                <p>৮০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ২ - ৮০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ৩</h3>
                <p>১২০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ৩ - ১২০০ টাকা')">অর্ডার করুন</button>
            </div>
        </div>

        <div class="order-section" id="order">
            <h2>অর্ডার ফর্ম</h2>
            <form class="order-form" action="https://formspree.io/f/shopeasymarket2@gmail.com" method="POST">
                <label>নির্বাচিত পণ্য:</label>
                <input type="text" id="product-name" name="product" placeholder="উপরের যেকোনো 'অর্ডার করুন' বাটনে ক্লিক করুন" readonly required>

                <label>আপনার নাম:</label>
                <input type="text" name="customer_name" placeholder="আপনার পুরো নাম লিখুন" required>

                <label>মোবাইল নম্বর (বিকাশ/নগদ সহ):</label>
                <input type="text" name="phone" placeholder="আপনার মোবাইল নম্বর দিন" required>

                <label>পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea name="address" rows="3" placeholder="বাসা/হোল্ডিং, রোড, থানা ও জেলা লিখুন" required></textarea>

                <button type="submit" class="submit-btn">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Easy Market — সর্বস্বত্ব সংরক্ষিত</p>
        <p>যোগাযোগ: shopeasymarket2@gmail.com</p>
    </footer>

    <script>
        function selectProduct(productInfo) {
            document.getElementById('product-name').value = productInfo;
            alert(productInfo + ' সিলেক্ট করা হয়েছে। নিচের ফর্মটি পূরণ করুন।');
            document.getElementById('order').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
