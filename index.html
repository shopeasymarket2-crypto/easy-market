<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Market - Premium Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            /* motionsites.ai এর মতো সুন্দর আকাশের ব্যাকগ্রাউন্ড লুক */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 50px 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        header h1 {
            font-size: 42px;
            margin: 0;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        header p {
            font-size: 18px;
            margin: 10px 0 0;
            color: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            font-size: 26px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: rgba(25, 25, 35, 0.75);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card h3 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        .product-card p {
            color: #38bdf8;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .order-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: opacity 0.2s;
        }
        .order-btn:hover {
            opacity: 0.9;
        }
        .order-section {
            margin-top: 50px;
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .order-form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #cbd5e1;
        }
        .order-form input, .order-form textarea {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .order-form input:focus, .order-form textarea:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .submit-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Easy Market</h1>
        <p>Shaping the Future of Online Shopping</p>
    </header>

    <div class="container">
        <h2>আমাদের প্রিমিয়াম পণ্যসমূহ</h2>
        <div id="product-list" class="product-grid">
            <div class="product-card">
                <h3>প্রোডাক্ট ১</h3>
                <p>৫০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ১ - ৫০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ২</h3>
                <p>৮০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ২ - ৮০০ টাকা')">অর্ডার করুন</button>
            </div>
            <div class="product-card">
                <h3>প্রোডাক্ট ৩</h3>
                <p>১২০০ টাকা</p>
                <button class="order-btn" onclick="selectProduct('প্রোডাক্ট ৩ - ১২০০ টাকা')">অর্ডার করুন</button>
            </div>
        </div>

        <div class="order-section">
            <h2>অর্ডার ফর্ম</h2>
            <form class="order-form" action="https://formspree.io/f/shopeasymarket2@gmail.com" method="POST">
                <label>নির্বাচিত পণ্য:</label>
                <input type="text" id="product-name" name="product" placeholder="উপরের যেকোনো 'অর্ডার করুন' বাটনে ক্লিক করুন" readonly required>

                <label>আপনার নাম:</label>
                <input type="text" name="customer_name" placeholder="আপনার পুরো নাম লিখুন" required>

                <label>মোবাইল নম্বর (বিকাশ/নগদ সহ):</label>
                <input type="text" name="phone" placeholder="আপনার মোবাইল নম্বর দিন" required>

                <label>পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea name="address" rows="3" placeholder="বাসা/হোল্ডিং, রোড, থানা ও জেলা লিখুন" required></textarea>

                <button type="submit" class="submit-btn">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Easy Market — সহজ কেনাকাটা, সাশ্রয়ী দামে</p>
        <p>যোগাযোগ: shopeasymarket2@gmail.com</p>
    </footer>

    <script>
        function selectProduct(productInfo) {
            document.getElementById('product-name').value = productInfo;
            alert(productInfo + ' সিলেক্ট করা হয়েছে। নিচের ফর্মটি পূরণ করে অর্ডার কনফার্ম করুন।');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
